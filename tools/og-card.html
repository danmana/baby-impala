<!doctype html>
<!-- Share card for about.html. Serve with the dev server (npx vite) and screenshot /tools/og-card.html at 1200x630, then save as public/og/about.jpg. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>og card</title>
<style>
  @font-face { font-family: 'League Gothic'; src: url('/fonts/LeagueGothic.ttf'); }
  @font-face { font-family: 'Special Elite'; src: url('/fonts/SpecialElite-Regular.ttf'); }
  @font-face { font-family: 'Reenie Beanie'; src: url('/fonts/ReenieBeanie-Regular.ttf'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0b0a09; }
  .sheet {
    position: absolute; left: 44px; top: 40px; width: 1112px; height: 550px;
    background-color: #d7c8a2;
    background-image:
      linear-gradient(90deg, transparent 58px, rgba(143, 42, 29, 0.32) 58px 59.5px, transparent 59.5px),
      radial-gradient(140% 60% at 50% 0%, rgba(255, 249, 230, 0.25), transparent 60%),
      url('/ui/paper_stains.webp'), url('/ui/paper_page.webp');
    background-size: 100% 100%, 100% 100%, 900px 900px, 600px 600px;
    background-blend-mode: normal, soft-light, multiply, normal;
    box-shadow: 0 2px 2px rgba(0,0,0,.5), 0 24px 60px -10px rgba(0,0,0,.7), inset 0 0 60px rgba(112,78,34,.22);
    transform: rotate(-0.6deg);
  }
  .text { position: absolute; left: 96px; top: 112px; width: 420px; color: #2a2118; }
  .kicker { font-family: 'Reenie Beanie'; font-size: 44px; color: #8f2a1d; margin: 0; transform: rotate(-1.5deg); transform-origin: left; }
  h1 { font-family: 'League Gothic'; font-weight: 400; font-size: 128px; line-height: .86; margin: 10px 0 22px; }
  .sub { font-family: 'Special Elite'; font-size: 19px; line-height: 1.45; color: #5b5247; margin: 0; }
  .photo {
    position: absolute; right: 58px; top: 96px; width: 500px; background: #f4efe4; padding: 12px 12px 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 28px -8px rgba(0,0,0,.5); transform: rotate(1.8deg);
  }
  .photo img { display: block; width: 100%; }
  .photo p { font-family: 'Reenie Beanie'; font-size: 30px; margin: 8px 4px 0; color: #2a2118; }
  .photo::before, .photo::after {
    content: ''; position: absolute; top: -14px; width: 110px; height: 30px;
    background: url('/ui/tape.webp') center / 100% 100% no-repeat; opacity: .88;
  }
  .photo::before { left: 20px; transform: rotate(-6deg); }
  .photo::after { right: 20px; transform: rotate(5deg); }
</style>
</head>
<body>
  <div class="sheet">
    <div class="text">
      <p class="kicker">notes from the build</p>
      <h1>How Baby was built</h1>
      <p class="sub">A 3D fan page for Dean Winchester’s ’67 Impala: the Blender build, the trunk, the lighting, and how it was tested.</p>
    </div>
    <div class="photo">
      <img src="/about/board.webp" alt="" />
      <p>the pegboard, every piece on a peg or a clip</p>
    </div>
  </div>
</body>
</html>
